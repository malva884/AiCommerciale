[browser]
# Nessuna telemetria inviata a Streamlit/Segment: dati 100% on-premise
gatherUsageStats = false

[client]
# Nasconde la toolbar nativa (menu ⋮, pulsante "Deploy" per Community Cloud):
# il deploy passa da Coolify, non serve agli utenti della dashboard
toolbarMode = "viewer"

[server]
port = 8501

[theme]
base = "dark"
primaryColor = "#7c5cff"
backgroundColor = "#080c18"
secondaryBackgroundColor = "#0f1526"
textColor = "#f1f5f9"
font = "sans serif"
