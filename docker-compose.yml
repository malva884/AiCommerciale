services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      TZ: Europe/Rome
      PYTHONUNBUFFERED: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434/api/chat
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-450}
      GEMINI_MIN_INTERVAL: ${GEMINI_MIN_INTERVAL:-4.5}
      TED_API_KEY: ${TED_API_KEY:-}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-10.141.1.8}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DB: ${SQLSERVER_DB:-GP_NX_AGG}
      SQLSERVER_USER: ${SQLSERVER_USER:-GPSCH}
      SQLSERVER_PWD: ${SQLSERVER_PWD}
      SQLSERVER_DRIVER: ${SQLSERVER_DRIVER:-ODBC Driver 18 for SQL Server}
    volumes:
      - app_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Worker notturno in background: esegue main.py ogni notte (default 01:00 ora italiana)
  # e popola il DB SQLite condiviso (app_data) senza bloccare l'interfaccia.
  scheduler:
    build: .
    command: ["python", "scheduler.py"]
    environment:
      TZ: Europe/Rome
      PYTHONUNBUFFERED: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-450}
      GEMINI_MIN_INTERVAL: ${GEMINI_MIN_INTERVAL:-4.5}
      TED_API_KEY: ${TED_API_KEY:-}
      NIGHTLY_SCHEDULE_TIME: ${NIGHTLY_SCHEDULE_TIME:-01:00}
      RUN_ON_STARTUP_IF_EMPTY: ${RUN_ON_STARTUP_IF_EMPTY:-1}
    volumes:
      - app_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Pull del modello al primo avvio, poi esce (restart: no)
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: /bin/sh
    command: -c "ollama pull ${OLLAMA_MODEL:-llama3.1:8b}"
    restart: "no"

volumes:
  app_data:
  ollama_data:
